name = "hac_bindgen_backend"
description = "Libadalang analysis backend for hac_bindgen"
version = "0.1.0-dev"
authors = ["hac_bindgen maintainers"]
licenses = "Apache-2.0"

# Isolation architecture (see docs/dev/design_discussions.md, analysis
# backend evaluation): the main hac_bindgen crate requires GNAT >= 16,
# which Libadalang's dependency closure does not support today, so this
# backend is pinned to the GNAT 15.x line that Libadalang 26.0.0 builds
# against. Coupling with the main crate is only the textual model dump.
[[depends-on]]
libadalang = "=26.0.0"
libadalang_tools = "^26.0.0"
gnat = ">=15.2.1 & <16.0.0"
