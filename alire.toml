name = "hac_bindgen"
description = "Binding generator: expose native Ada APIs to embedded HAC scripts"
version = "0.1.2-dev"

authors = ["Lionel Draghi"]
maintainers = ["Lionel Draghi <lionel.draghi@free.fr>"]
maintainers-logins = ["LionelDraghi"]
licenses = "Apache-2.0"
website = "https://github.com/LionelDraghi/hac_bindgen"
tags = ["hac", "scripting", "bindings", "code-generation"]

project-files = ["hac_bindgen.gpr"]

[configuration]
output_dir = "src/Alire_config"
generate_C = false
generate_gpr = false

[[depends-on]]
# The generated code targets the HAC_Sys.Interfacing API; the witness
# application of the end-to-end tests embeds HAC directly.
hac = ">=0.45"

[[depends-on]]
gnat = ">=16"

[[pins]]
# Leading edge of HAC, until a release newer than 0.45.0 reaches the Alire
# index. The features merged upstream after v0.45 are the ones this generator
# needs: imported native functions with a return value, named parameter
# associations, a per-registration call-back context, and the controlled
# propagation of a native failure into the VM.
# Local development only: the pin designates a sibling checkout, so it must not
# be committed as is. Without it, the resolution falls back on the released
# 0.45.0, which keeps the CI and the other developers on a published crate.
hac = { path = "../hac" }
