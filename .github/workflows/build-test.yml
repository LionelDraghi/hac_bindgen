name: Build and test

on:                    # Run the workflow for each of the following events:
  push:                # - The main branch is pushed or updated.
    branches:
      - main
    paths: &trigger_paths
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/features/**'
      - 'docs/examples/**'
      - '.github/workflows/**'
      - 'Makefile'
      - 'alire.toml'
      - 'hac_bindgen.gpr'

  pull_request:        # - A pull-request is opened or updated.
    paths: *trigger_paths

  workflow_dispatch:   # - A manual run of the workflow is requested from
                       #   the GitHub web interface.

concurrency:
  # A new push cancels the run still in flight: the Libadalang build
  # takes the large share of a run, no need to let two of them fight.
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't stop all the workflows when one of them fails.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        # macos-15, not macos-latest: the macOS 26 (Tahoe) image ships
        # Command Line Tools 26.6, whose SDK .tbd stubs list the arm64e.x1
        # targets; the linker bundled with every GNAT FSF toolchain (15.x
        # and 16.x alike) rejects them and every link fails with
        # "malformed file libSystem.tbd" and undefined libc symbols
        # (cf. https://github.com/alire-project/GNAT-FSF-builds/issues/112).
        # Switch back to macos-latest once the toolchain linker is fixed.

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and set up Alire
        uses: alire-project/setup-alire@v5
        with:
          # Same version as the local development environment.
          version: 2.1.1

      - name: Relocate the Alire cache on Windows
        # The alr GNAT runtime copies files through a 256-character path
        # buffer: with the default cache under %LOCALAPPDATA%\alire\cache,
        # the build dir of dependencies with deep trees exceeds it and
        # `alr build` fails with "Could not sync build dir"
        # (cf. https://github.com/alire-project/alire/issues/1762).
        # A short cache root keeps every path under the limit.
        if: runner.os == 'Windows'
        run: alr settings --global --set cache.dir C:\alr-cache

      - name: Cache Alire dependencies
        # Dependency builds are expensive (Libadalang is the large
        # share of a cold run), and independent of the sources:
        # cache the alire data of all the platforms, keyed on both
        # alire.toml files (the main crate and the backend crate).
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/AppData/Local/alire
            C:/alr-cache
          key: ${{ matrix.os }}-alire-${{ hashFiles('alire.toml', 'tools/libadalang_backend/alire.toml') }}
          restore-keys: |
            ${{ matrix.os }}-alire-

      - name: Setup AT-SPI backend dev packages (Linux)
        # Building bbt (the executable documentation's runner) links its
        # Linux-only AT-SPI GUI backend against -l:libatspi.so.0,
        # -lgobject-2.0 and -lglib-2.0: the images carry the runtime
        # libraries, but the linker needs the -dev symlink of each.
        # Same step as bbt's own CI.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-dev libglib2.0-dev

      - name: Install bbt from its latest release
        # The executable documentation runs with bbt. Building bbt from
        # its main branch made hac_bindgen's CI follow bbt's development
        # state, and inherit its breakage windows (which is how the
        # 2026-11-09 run went red). The bbt releases have no binary
        # assets, and the community index lags behind (0.6.0 there,
        # 0.6.1 released with the libglib system dependency fix), so
        # "latest release" here means: clone the latest release tag
        # shallowly and build it (its gpr leaves the binary at the
        # crate root). Follow bbt's releases, not its main branch.
        shell: bash
        run: |
          TAG=$(git ls-remote --tags https://github.com/LionelDraghi/bbt '0.*' \
                | awk -F'/' '{print $NF}' | grep -v '\^{}' | sort -V | tail -1)
          echo "Latest bbt release: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/LionelDraghi/bbt ../bbt
          (cd ../bbt && alr build)
          echo "$(cd ../bbt && pwd)" >> "${GITHUB_PATH}"

      - name: Build and run the checks
        # make check = tool build (GNAT 16.x), backend build (GNAT 15.x
        # line), the bbt scenarios of docs/features, then the
        # getting-started example of docs/examples, whose chain ends
        # with a HAC script printing distance = 5.0. KEEP_GOING asks
        # bbt to run everything despite failures, so the artifacts keep
        # the total count of passing and failing scenarios.
        env:
          # On Darwin, avoid file name casing glitches with the GNAT
          # FSF toolchain (cf. the note in README.md, and
          # https://forum.ada-lang.io/t/name-file-casing-error-on-darwin/1795).
          GNAT_FILE_NAME_CASE_SENSITIVE: ${{ startsWith(matrix.os, 'macos') && '1' || '' }}
        run: make check KEEP_GOING=--keep_going
